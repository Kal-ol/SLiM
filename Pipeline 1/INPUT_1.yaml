# Configuration file for pipeline 1 

# Paths
base: "$HOME/slim_runs"
result_name: "pipeline1_full_muBDMI_1e-4_50reps"
model_name: "annual_base"
slim_script: "$HOME/slim_runs/scripts/06_22_2026_model_v4_1.SLIM"

# Model settings
bdmi_accumulation: "burnin"
scenario: "neutral"

# Sweep settings
mu_bdmi_values: "1e-4"
total_reps: 50

# Generation/section settings
burnin: 2000
end_gen: 5000
remember_every: 100

# Mutation / ecological settings passed into SLiM
mu_pheno: "1e-5"
mu_neutral: "0"
hyb_rate: "0.01"
alpha: "0.01"
max_ovules: 5

# SLiM module
slim_module: "slim/4.3"

# Slurm settings
slurm_account: "usuplants-np"
slurm_partition: "usuplants-np"
slurm_qos: "NONE"
time: "72:00:00"
mem: "8G"
cpus_per_task: 1

# Parallelism
# This becomes --array=1-N%max_parallel
max_parallel: 40
